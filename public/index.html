<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.20/dist/98.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: teal;
            overflow: hidden;
        }

        .window {
            width: min(900px, 95vw);
            height: min(700px, 92vh);
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            flex-shrink: 0;
        }

        .window-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: white;
            border: 2px inset #dfdfdf;
            padding: 8px;
        }

        .message {
            margin-bottom: 10px;
        }

        .message-header {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .message-name {
            font-weight: bold;
        }

        .message-time {
            color: #666;
            font-size: 11px;
        }

        .message-text {
            margin-top: 3px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #form {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        #name {
            width: 130px;
        }

        #message {
            flex: 1;
        }

        #send {
            min-width: 80px;
        }

        .status-bar {
            flex-shrink: 0;
        }

        .status-bar-field {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">Realtime Chat</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>

        <div class="window-body">
            <div id="messages"></div>

            <form id="form">
                <input
                    id="name"
                    type="text"
                    maxlength="30"
                    placeholder="名前"
                    required
                >

                <input
                    id="message"
                    type="text"
                    maxlength="500"
                    placeholder="メッセージ"
                    required
                >

                <button id="send" type="submit">送信</button>
            </form>
        </div>

        <div class="status-bar">
            <p class="status-bar-field" id="status">接続中...</p>
            <p class="status-bar-field">WebSocket</p>
        </div>
    </div>

    <script>
        const messages = document.getElementById("messages")
        const form = document.getElementById("form")
        const nameInput = document.getElementById("name")
        const messageInput = document.getElementById("message")
        const status = document.getElementById("status")

        const ws = new WebSocket(`ws://${location.host}`)

        function addMessage(data) {
            const container = document.createElement("div")
            container.className = "message"

            const header = document.createElement("div")
            header.className = "message-header"

            const name = document.createElement("span")
            name.className = "message-name"
            name.textContent = data.name

            const time = document.createElement("span")
            time.className = "message-time"

            const date = new Date(data.created_at)

            time.textContent = date.toLocaleTimeString("ja-JP", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            })

            const text = document.createElement("div")
            text.className = "message-text"
            text.textContent = data.message

            header.appendChild(name)
            header.appendChild(time)

            container.appendChild(header)
            container.appendChild(text)

            messages.appendChild(container)
            messages.scrollTop = messages.scrollHeight
        }

        ws.addEventListener("open", () => {
            status.textContent = "接続済み"
        })

        ws.addEventListener("close", () => {
            status.textContent = "切断されました"
        })

        ws.addEventListener("error", () => {
            status.textContent = "接続エラー"
        })

        ws.addEventListener("message", event => {
            const data = JSON.parse(event.data)

            if (data.type === "history") {
                messages.replaceChildren()

                for (const message of data.messages) {
                    addMessage(message)
                }

                return
            }

            if (data.type === "message") {
                addMessage(data.message)
                return
            }

            if (data.type === "clear") {
                messages.replaceChildren()
            }
        })

        form.addEventListener("submit", event => {
            event.preventDefault()

            const name = nameInput.value.trim()
            const message = messageInput.value.trim()

            if (!name || !message) {
                return
            }

            if (ws.readyState !== WebSocket.OPEN) {
                return
            }

            ws.send(JSON.stringify({
                name,
                message
            }))

            messageInput.value = ""
            messageInput.focus()
        })
    </script>
</body>
</html>
